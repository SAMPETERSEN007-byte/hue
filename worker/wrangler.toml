# HUE report-mailer — Stripe webhook -> Resend report email, plus the unlock
# entitlement endpoints (/verify, /session).
#
# This worker was originally created by pasting source into the Cloudflare
# dashboard, so there was no wrangler config and no one-command deploy. There is
# now. `name` must stay exactly "hue-report-mailer" — that is the existing worker
# behind hue-report-mailer.synapse-sam.workers.dev, which the live site and the
# Stripe webhook both point at. Changing it creates a SECOND worker and silently
# leaves the real one running the old code.
#
# Deploy:
#   cd ~/Backups/hue-deploy-staged/worker && wrangler login && wrangler deploy
#
# Secrets already set on the deployed worker (wrangler deploy does NOT clear
# them, and they are deliberately not in this file):
#   STRIPE_WEBHOOK_SECRET  — Stripe signature verification; ALSO derives the
#                            unlock-token signing key (label "hue-unlock-v1").
#                            Rotating it invalidates every issued unlock token.
#   RESEND_API_KEY         — report delivery
#
# Optional, enables the post-checkout /session path:
#   STRIPE_API_KEY  — RESTRICTED, read-only on Checkout Sessions.
#                     wrangler secret put STRIPE_API_KEY
#   Without it /session returns 501 and the site tells the buyer to open the
#   link in their email. Nothing breaks; the return-from-Stripe unlock is just
#   deferred until the email lands.
#
# Optional, enables the server-side Meta Conversions API Purchase:
#   META_PIXEL_ID    — 928398310306386 (the pixel, NOT the ad account id)
#   META_CAPI_TOKEN  — Events Manager -> Data sources -> the pixel -> Settings
#                      -> Conversions API -> Generate access token
#   wrangler secret put META_PIXEL_ID && wrangler secret put META_CAPI_TOKEN
#   With BOTH set, checkout.session.completed reports Purchase server-to-server,
#   deduped against the browser pixel on the Stripe session id. With either
#   missing, sendCAPI returns capi-not-configured and does nothing — the
#   webhook, the email and the unlock are all unaffected either way.
#
#   META_TEST_EVENT_CODE — OPTIONAL and temporary. Set it to watch events land
#   in Events Manager -> Test events without polluting live attribution, then
#   UNSET it (`wrangler secret delete META_TEST_EVENT_CODE`) to go live. Leaving
#   it set means real purchases are only ever counted as test events.
#
# The post-checkout gap is CLOSED. The Stripe Payment Link success URL is
#   https://huebloom.app/?sid={CHECKOUT_SESSION_ID}
# verified in the Stripe dashboard 8/12 on the live $29.99 payment link. So the
# worker-verified ?sid= return path IS live, and a buyer is not solely dependent
# on the report email arriving.
#
# NOTE: this whole directory is served publicly by GitHub Pages
# (huebloom.app/worker/wrangler.toml returns 200), so keep internal dashboard
# identifiers out of it. Nothing here is secret — every credential is a wrangler
# secret, never a file — but it is needlessly public all the same.
#
# This comment previously said the URL was "currently ?unlocked=1, which no
# longer unlocks anything". That was stale, and it cost real work: an audit
# read it, believed it over the dashboard, and raised a P1 that every buyer's
# access hung on email delivery. A verifier then "confirmed" the finding from
# this same comment. A stale note about external config is worse than no note,
# because it reads as evidence. If the success URL changes, change it HERE in
# the same commit — or delete these lines rather than let them rot.

name = "hue-report-mailer"
main = "report-mailer.js"
compatibility_date = "2026-08-01"
